<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <title>Presentation-Tool: Slides left</title>

    <link rel="stylesheet" href="/vendor/reveal/reset.css" />
    <link rel="stylesheet" href="/vendor/reveal/reveal.css" />
    <link rel="stylesheet" href="css/theme/akablas.css" />

    <script src="/vendor/socket.io/socket.io.min.js"></script>
    <script src="/vendor/jquery/jquery.slim.min.js"></script>
    <script src="js/script.js"></script>
  </head>
  <body onLoad='controlSlide("left")'>
    <div class="reveal">
      <div class="slides">
        <section data-slide="start">
          <!-- ## START ## -->
        </section>
        <section data-slide="abc">
          <!-- 01 -->
        </section>
        <section data-slide="def">
          <!-- 02 -->
        </section>
        <section data-slide="geh">
          <!-- 03 -->
        </section>
        <section data-slide="pause">
          <!-- ## PAUSE ## -->
        </section>
        <section data-slide="xyz">
          <!-- 05 -->
          <section data-slide="xyz-a">
            <!-- 05a -->
          </section>
          <section data-slide="xyz-b">
            <!-- 05b -->
          </section>
          <section data-slide="xyz-c">
            <!-- 05c -->
          </section>
        </section>
        <section data-slide="123">
          <!-- 06 -->
        </section>
        <section data-slide="encore">
          <!-- ## ENCORE ## -->
        </section>
        <section data-slide="end">
          <!-- ## END ## -->
        </section>
      </div>
    </div>
    <script src="/vendor/reveal/reveal.js"></script>
    <script>
      Reveal.initialize({
        controls: false,
        progress: false,
        transition: "fade",
        width: 1920,
        height: 1080,
        margin: 0,
      });
    </script>
  </body>
</html>
