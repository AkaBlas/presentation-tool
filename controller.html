<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Presentation-Tool: Controller</title>
    <link rel="stylesheet" href="css/controller.css" />
    <script src="/vendor/socket.io/socket.io.min.js"></script>
    <script src="/vendor/jquery/jquery.slim.min.js"></script>
    <script>
      $(function () {
        const socket = io();

        const emitCommand = (command) => {
          if (!command) {
            return;
          }

          console.log("Emit: ", command);
          socket.emit("slideCommand", command);
        };

        socket.on("slideStatus", (msg) => {
          if (!msg.side || !(msg.side === "left" || msg.side === "right")) {
            return false;
          }
          let msgArea;
          if (msg.side === "left") {
            msgArea = $("#messages_left");
          } else if (msg.side === "right") {
            msgArea = $("#messages_right");
          }
          if (msgArea.children().length > 5) {
            msgArea.children().first().next("li").remove();
          }
          msgArea.append($("<li>").text(msg.code));
        });

        $("form").submit((e) => {
          e.preventDefault();
          const msgSelector = $("#m");
          emitCommand(msgSelector.val().trim());
          msgSelector.val("");
          return false;
        });

        $("table#list").click((e) => {
          e.stopPropagation();

          const targetEle = $(e.target).closest("td");
          const command = targetEle.data("command");
          if (command) {
            $("#list td").removeClass("ac-active");
            targetEle.addClass("ac-active ac-visited");
            emitCommand(command);
          }
        });

        $("#gr").click((e) => {
          const command = $(e.target).closest("button[data-command]").data("command");
          emitCommand(command);
        });

        $("body").keydown((e) => {
          if (e.key === "PageDown") {
            emitCommand("next");
          } else if (e.key === "PageUp") {
            emitCommand("prev");
          }
        });
      });
    </script>
  </head>
  <body>
    <div class="grid" id="gr">
      <div class="control special">
        <button class="control-button" data-command="black">
          <ion-icon name="contrast-sharp" aria-label="Toggle black"></ion-icon>
        </button>
        <button class="control-button" data-command="iframe">
          <ion-icon name="refresh-sharp"></ion-icon>
        </button>
      </div>
      <button class="control prev" data-command="prev">
        <ion-icon name="arrow-back-sharp" aria-label="Previous"></ion-icon>
      </button>
      <button class="control next" data-command="next">
        <ion-icon name="arrow-forward-sharp" aria-label="Next"></ion-icon>
      </button>
      <button class="control start" data-command="start">
        <ion-icon name="home-sharp" aria-label="Back to Start"></ion-icon>
      </button>
      <button class="control black" data-command="results">
        <ion-icon name="analytics-sharp" aria-label="Open Results"></ion-icon>
      </button>

      <section id="log">
        <ul id="messages_left">
          <small>Left</small>
        </ul>
        <ul id="messages_right">
          <small>Right</small>
        </ul>
      </section>

      <section class="actions">
        <form><input id="m" /></form>

        <table id="list">
          <tr>
            <td colspan="4" data-command="start">## START ##</td>
          </tr>
          <tr>
            <td colspan="2" data-command="abc">ABC</td>
            <td colspan="2" data-command="def">DEF</td>
          </tr>
          <tr>
            <td colspan="4" data-command="geh">GEH</td>
          </tr>
          <tr>
            <td colspan="4" data-command="pause">## PAUSE ##</td>
          </tr>
          <tr>
            <td colspan="4" data-command="xyz">XYZ</td>
          </tr>
          <tr>
            <td data-command="xyz-b">
              <small>b. XYZ 2</small>
            </td>
            <td data-command="xyz-c">
              <small>c. XYZ 3</small>
            </td>
          </tr>
          <tr>
            <td colspan="4" data-command="123">123</td>
          </tr>
          <tr>
            <td colspan="4" data-command="encore">## ENCORE ##</td>
          </tr>
          <tr>
            <td colspan="4" data-command="end">## END ##</td>
          </tr>
        </table>
      </section>
    </div>
    <script type="module" src="/vendor/ionicons/ionicons.esm.js"></script>
  </body>
</html>
